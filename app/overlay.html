<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reruns overlay</title>
  </head>
  <body>
    <div id="popup" class="popup" role="status" aria-live="polite">
      <span class="tile" aria-hidden="true">
        <span class="rec"></span>
        <!-- Icons from Lucide (ISC), as in the app. -->
        <svg class="glyph check" viewBox="0 0 24 24">
          <path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1" />
        </svg>
        <svg class="glyph camera" viewBox="0 0 24 24">
          <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
          <circle cx="12" cy="13" r="3" />
        </svg>
        <svg class="glyph flag" viewBox="0 0 24 24">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
          <path d="M4 22v-7" />
        </svg>
      </span>
      <span class="text">
        <span id="title" class="title"></span>
        <span id="detail" class="detail"></span>
      </span>
      <span class="life" aria-hidden="true"></span>
    </div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
