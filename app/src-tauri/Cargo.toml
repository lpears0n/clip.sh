[package]
name = "clip-sh"
description = "Instant-replay game clipping for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "clip_sh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clip-core = { path = "../../crates/clip-core" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde.workspace = true
serde_json.workspace = true
tauri-plugin-opener = "2"
dirs = "7.0.0"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tauri-plugin-dialog = "2"
trash = "5"
clip-ipc = { version = "0.1.0", path = "../../crates/clip-ipc" }
tauri-plugin-window-state = "2"
notify-debouncer-full = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target."cfg(windows)".dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
