[package]
name = "clip-core"
description = "Capture, encode and instant-replay buffer for clip.sh"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
tokio.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"

[dev-dependencies]
tracing-subscriber.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast", "global_shortcuts"] }
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-backend = "0.3"
rustix = { version = "1", features = ["event"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
winreg = "0.55"
